# Included inside the existing HTTPS server in sites-available/website.
# Keep this outside the homepage's build directory.
location = /airplanes {
    return 308 /airplanes/$is_args$args;
}

location ^~ /airplanes/ {
    alias /var/www/airplanes/current/;
    index index.html;
    autoindex off;

    # Include the complete standard map before extending it for ES modules.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/geo+json geojson;
    }

    # Static handling deliberately returns 404 for missing files. Do not use
    # the homepage's /index.html fallback for missing viewer assets.
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/geo+json image/svg+xml;
}
